services:
  backend:
    build: .
    image: legal-plugin-backend:latest
    env_file:
      - .env
    environment:
      # In-network service discovery (overrides the localhost defaults from config.py;
      # `environment` takes precedence over env_file).
      - REDIS_URL=redis://:myredissecret@redis:6379
      # Qdrant: defaults to a local `qdrant` container, but set QDRANT_REMOTE_URL in
      # .env to reuse an external instance (e.g. Spark http://172.20.0.22:6333). When
      # remote, DON'T start the local qdrant service — just omit it from `up`.
      - QDRANT_URL=${QDRANT_REMOTE_URL:-http://qdrant:6333}
      - DATABASE_URL=postgresql://legal:${APP_DB_PASSWORD:-legal}@app-db:5432/legal
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006
      # no OTEL_EXPORTER_OTLP_HEADERS — Phoenix needs no auth
      # OLLAMA_BASE_URL is supplied by .env (the Spark box: http://172.20.0.22:11434)
    volumes:
      - ./data/attorneys:/app/data/attorneys   # attorney USER.md preferences persist
    depends_on:
      # qdrant is intentionally NOT a depends_on — it may be external (Spark). Start a
      # local qdrant only by including it in the `up` service list.
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    volumes:
      - phoenix_data:/mnt/data
    # Container port 6006 = Phoenix UI + OTLP/HTTP ingest (/v1/traces); the backend
    # reaches it in-network at phoenix:6006. Published on host 6007 (6006 is taken by
    # compliance-bot's phoenix on this host) so the UI is browsable over the VPN at
    # http://<vm>:6007 — same posture as compliance-bot's phoenix on 6006.
    # ⚠ Phoenix has NO auth and traces carry contract text, so anyone who can reach the
    # VM on 6007 can read them. To lock down, bind 127.0.0.1:6007:6006 + SSH-tunnel, or
    # front it with a Caddy route + auth.
    ports:
      - "6007:6006"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ADDIN_ORIGIN_HOST=${ADDIN_ORIGIN_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./clients/word/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  phoenix_data:
