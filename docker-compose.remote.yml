# journald, not Docker's default json-file. A json-file log belongs to its
# container and is deleted with it, so every redeploy erased the app log — the
# 2026-10-08 pilot audit found nothing older than the last recreate. journald
# keeps it: `$DC logs` still reads the current container, and
# `sudo journalctl CONTAINER_NAME=legal-plugin-backend-1` reaches earlier ones.
# Docker Desktop has no journald, so a local dry run sets LOG_DRIVER=json-file
# in the SHELL — never in .env, whose unknown keys config.py rejects.
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}

services:
  backend:
    build: .
    image: legal-plugin-backend:latest
    logging: *logging
    env_file:
      - .env
    environment:
      # In-network service discovery (overrides the localhost defaults from config.py;
      # `environment` takes precedence over env_file).
      - REDIS_URL=redis://:myredissecret@redis:6379
      # Qdrant: defaults to a local `qdrant` container, but set QDRANT_REMOTE_URL in
      # .env to reuse an external instance (e.g. Spark http://172.20.0.22:6333). When
      # remote, DON'T start the local qdrant service — just omit it from `up`.
      - QDRANT_URL=${QDRANT_REMOTE_URL:-http://qdrant:6333}
      - DATABASE_URL=postgresql://legal:${APP_DB_PASSWORD:-legal}@app-db:5432/legal
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://phoenix:6006
      # no OTEL_EXPORTER_OTLP_HEADERS — Phoenix needs no auth
      # OLLAMA_BASE_URL is supplied by .env (the Spark box: http://172.20.0.22:11434)
    volumes:
      - ./data/attorneys:/app/data/attorneys   # attorney USER.md preferences persist
    depends_on:
      # qdrant is intentionally NOT a depends_on — it may be external (Spark). Start a
      # local qdrant only by including it in the `up` service list.
      redis:
        condition: service_healthy
      app-db:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  phoenix:
    # Pinned: the database in phoenix_data was written by this version, and
    # `latest` would migrate it on whatever day the image next got pulled.
    image: arizephoenix/phoenix:15.2.0@sha256:3ff9ee3bc108852c15c3eccc89bef4270d3a1c6aed89eb2b1a5d99240d1632fd
    restart: unless-stopped
    environment:
      # Without this Phoenix writes to ~/.phoenix INSIDE the container and the
      # volume below stays empty, so every recreate wiped every trace — found
      # 2026-10-08, when nothing older than the 2026-09-18 redeploy survived.
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
    # Container port 6006 = Phoenix UI + OTLP/HTTP ingest (/v1/traces); the backend
    # reaches it in-network at phoenix:6006. Published on host 6007 (6006 is taken by
    # compliance-bot's phoenix on this host).
    # Published on ALL interfaces on purpose: browsed directly at
    # http://172.20.1.10:6007 from the VPN, no SSH tunnel (owner's decision —
    # bound to loopback 2026-09-16, re-opened on the VM 2026-09-18, made the repo
    # default 2026-10-08). Phoenix has NO auth and its spans carry the full
    # uploaded contract, the governing MSA and the firm's playbook bundle, so
    # anyone on the VPN who knows the address can read them.
    ports:
      - "6007:6006"

  caddy:
    # Builds the task pane INTO the image (see clients/word/Dockerfile) instead
    # of bind-mounting a host-built ./clients/word/dist. That mount could not be
    # kept current: dist/ is gitignored so `git pull` never touched it, only the
    # backend image was rebuilt by `up --build`, and the VM has no npm — so the
    # served pane silently froze at whatever was last built by hand while the
    # backend kept moving. Now `up --build` produces both from one commit.
    build: ./clients/word
    image: legal-plugin-pane:latest
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ADDIN_ORIGIN_HOST=${ADDIN_ORIGIN_HOST:-localhost}
    volumes:
      # The Caddyfile stays a bind mount — cert and hostname changes (Step 2 of
      # the runbook) should not need an image rebuild.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  phoenix_data:
